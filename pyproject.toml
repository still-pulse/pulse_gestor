[project]
name = "pulse_gestor"
authors = [
	{ name = "Still Pulse", email = "dev@stillpulse.com.br" }
]
description = "Documentação da Unidade — cadastro de documentos por empresa/unidade com validade e alerta de vencimento"
requires-python = ">=3.11"
readme = "README.md"
dynamic = ["version"]
dependencies = [
	# Bibliotecas externas importadas diretamente pelo app (também exigidas pelo Frappe v15; declaradas aqui
	# para não depender de instalação transitiva). pypng é exigido pelo ERPNext (e usado por pyqrcode.png_as_base64_str).
	"PyQRCode~=1.2.1",
	"pypng~=0.20220715.0",
	# Apps Frappe obrigatórios: declarados em required_apps (hooks.py) e instalados pelo bench, não pelo pip.
	# "frappe~=15.0.0"
	# "erpnext~=15.0.0"
	# "clm" # repositório próprio (still-pulse/clm); os formatos de impressão estendem clm_base.html.
	# Apps opcionais, importados só com guarda (try/ImportError ou get_installed_apps) e NÃO declarados em
	# required_apps de propósito: assinatura_eletronica (assinatura.py) e integracoes_customizadas (telefone.py e
	# reuniao_de_comissao.py). Ver docs/adr-003-padronizacao-de-lint-e-ci.md.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
	"B017",
	"B018",
	"B023",
	"B904",
	"E101",
	"E402",
	"E501",
	"E741",
	"F403",
	"F405",
	"F722",
	"W191",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
