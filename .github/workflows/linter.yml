
name: Linters

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    name: 'Semantic Commits'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 200
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Check commit titles
        run: |
          npm install @commitlint/cli @commitlint/config-conventional conventional-changelog-conventionalcommits
          npx commitlint --verbose --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  linter:
    name: 'Frappe Linter'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      # Passos de pre-commit/action@v3.0.1 (composite que usa actions/cache@v4 em Node 20 deprecado),
      # reescritos aqui para usar actions/cache@v6.
      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Cache pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Run Semgrep rules
        run: |
          pip install semgrep
          # Em pull request o semgrep ci já é diff-aware. No disparo manual, compara com a main para manter o
          # mesmo escopo (achados antigos fora do diff não entram) em vez de varrer o repositório inteiro.
          baseline=()
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            baseline=(--baseline-commit "$(git merge-base origin/main HEAD)")
          fi
          semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness "${baseline[@]}"

  deps-vulnerable-check:
    # Informativo: não bloqueia o gate. Audita o pyproject do app e as dependências de frappe, erpnext e hrms
    # nas versões usadas pelo CI (branch version-15). Ver docs/adr-003-padronizacao-de-lint-e-ci.md.
    name: 'Vulnerable Dependency Check (informativo)'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/checkout@v7

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install pip-audit and build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libmariadb-dev
          pip install pip-audit

      - name: Audit app and Frappe stack (version-15)
        run: |
          status=0
          pip-audit --desc on . || status=1
          for app in frappe/frappe frappe/erpnext frappe/hrms; do
            name="${app#*/}"
            git clone --depth 1 --branch version-15 "https://github.com/${app}.git" "audit-${name}"
            echo "::group::pip-audit ${app}@version-15"
            pip-audit --desc on "./audit-${name}" || status=1
            echo "::endgroup::"
          done
          exit "$status"
