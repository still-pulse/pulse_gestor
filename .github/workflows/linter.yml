
name: Linters

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    name: 'Semantic Commits'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 200
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Check commit titles
        run: |
          npm install @commitlint/cli @commitlint/config-conventional conventional-changelog-conventionalcommits
          npx commitlint --verbose --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  linter:
    name: 'Frappe Linter'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      # Passos de pre-commit/action@v3.0.1 (composite que usa actions/cache@v4 em Node 20 deprecado),
      # reescritos aqui para usar actions/cache@v6.
      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Cache pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Run Semgrep rules
        run: |
          pip install semgrep
          semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness

  deps-vulnerable-check:
    name: 'Vulnerable Dependency Check'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/checkout@v7

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install and run pip-audit
        run: |
          pip install pip-audit
          cd ${GITHUB_WORKSPACE}
          pip-audit --desc on .

  pip-audit-framework:
    # Informativo: audita as dependências do Frappe, ERPNext e HRMS (version-15), que o pip-audit do
    # pyproject não cobre. Não bloqueia o merge (continue-on-error); serve para acompanhar vulnerabilidades.
    name: 'Vulnerable Dependency Check (Frappe, ERPNext, HRMS)'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pip-audit and build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libmariadb-dev
          pip install pip-audit

      - name: Audit frappe, erpnext and hrms
        run: |
          status=0
          for app in frappe/frappe frappe/erpnext frappe/hrms; do
            name="${app#*/}"
            git clone --depth 1 --branch version-15 "https://github.com/${app}.git" "/tmp/${name}"
            echo "::group::pip-audit ${name}"
            pip-audit --desc on "/tmp/${name}" || status=1
            echo "::endgroup::"
          done
          exit "$status"
